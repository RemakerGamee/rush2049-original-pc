# Fresh install defaults: matched device profiles, automatic player-port assignment.
# Wired KIWITATA; A/B corrected from Scott's physical native-game report.
# Explicit physical-index profile overrides the incorrect generic SDL mapping.
rush-input 1
keyboard-port 0
profile kiwitata-wired guid 0300550d632500007505000000000000
  deadzone 0.15
  stick-x axis 0
  stick-y axis 1 invert
  bind A button 2
  bind B button 1
  bind Z button 6
  bind Start button 12
  bind L button 4
  bind R button 5
  bind C-Up button 9
  bind C-Down button 3
  bind C-Left button 0
  bind C-Right button 8
  bind D-Up hat 0 up
  bind D-Down hat 0 down
  bind D-Left hat 0 left
  bind D-Right hat 0 right

profile saffun-wireless guid 03003d486f0e00001311000000000000
  deadzone 0.15
  stick-x axis 0
  stick-y axis 1 invert
  bind A button 2
  bind B button 1
  bind Z button 6
  bind Start button 9
  bind L button 4
  bind R button 5
  bind C-Up button 11
  bind C-Down button 3
  bind C-Left button 0
  bind C-Right button 10
